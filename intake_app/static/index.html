<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수강나침반 · 내 수강 정보</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="수강나침반 홈"><span class="brand-icon" aria-hidden="true"></span>수강나침반</a>
    <nav class="top-actions" aria-label="주 메뉴">
      <a id="home-nav" href="/">수강 정보</a>
      <a id="recommend-nav" href="/recommendations" target="_blank" rel="noopener">과목 추천</a>
    </nav>
    <button id="my-info" class="button secondary" type="button" aria-haspopup="dialog"><span class="profile-icon" aria-hidden="true"></span>내 정보</button>
  </div>
</header>
<main>
    <section class="page-hero" id="home-panel" hidden>
      <h1>수강 정보</h1>
      <p>학생 정보와 이수내역을 확인하세요.</p>
      <button id="edit-profile" class="button" type="button" aria-haspopup="dialog">수강 정보 입력·수정</button>
    </section>
    <section id="recommendations" aria-labelledby="recommendation-title" hidden>
      <header class="page-hero">
        <div class="hero-row"><h1 id="recommendation-title">과목 추천</h1><button id="run-recommendations" class="button">다시 추천받기</button></div>
        <div id="recommendation-metrics" class="summary-metrics" hidden></div>
        <p id="recommendation-summary" role="status"></p>
      </header>
      <div id="recommendation-results"></div>
    </section>
    <dialog id="profile-dialog" aria-labelledby="profile-title">
      <header class="dialog-header"><h1 id="profile-title">내 수강 정보</h1><button id="close-profile" class="button secondary" type="button">닫기</button></header>
      <div id="profile-content">
    <nav class="steps" aria-label="입력 단계">
      <div class="step active" data-step="1"><span>학생 정보</span></div>
      <div class="step" data-step="2"><span>이수 내역</span></div>
      <div class="step" data-step="3"><span>확인 및 저장</span></div>
    </nav>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <section id="step-1" class="step-panel">
      <section class="card"><div class="card-title"><div><h2>학생 기본 정보</h2></div></div>
        <div class="form-grid">
          <label>입학연도 <span class="required">*</span><input id="admission-year" type="number" min="1990" max="2099" placeholder="예: 2024"></label>
          <label>현재 학년 <span class="required">*</span><select id="grade"><option value="">학년 선택</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option><option value="4">4학년 이상</option></select></label>
          <label>전공<select id="department"><option value="DEPT_CS">컴퓨터공학과</option></select></label>
          <label>입학 유형<select id="admission-type"><option value="freshman">신입학</option><option value="transfer">편입학</option></select></label>
          <label>이수한 정규학기 수 <span class="optional">선택</span><input id="regular-terms" type="number" min="0" max="300" step="1"></label>
        </div>
        <div id="transfer-box" class="subsection" hidden><p class="notice">편입생 정보는 입력할 수 있습니다. 졸업요건 적용은 편입학 기준을 확보한 후 지원합니다.</p><label>승인받은 편입 인정학점 <span class="optional">선택</span><input id="transfer-credits" type="number" min="0" max="300" step="0.5" placeholder="확인된 학점만 입력"></label></div>
      </section>
      <section class="card"><div class="card-title"><div><h2>다음 학기 선호</h2></div></div>
        <div class="form-grid"><label>희망 최소학점 <span class="optional">선택</span><input id="min-credits" type="number" min="0" max="30" step="1" placeholder="예: 15"></label><label>희망 최대학점 <span class="optional">선택</span><input id="max-credits" type="number" min="0" max="30" step="1" placeholder="예: 20"></label></div>
        
        <div class="field-label">관심 주제 <span class="optional">여러 개 선택 가능</span></div><div id="tags"></div>
      </section>
    </section>
    <section id="step-2" class="step-panel" hidden>
      <section class="card">
        <h2>에브리타임 시간표 가져오기</h2>
        <form id="import-form" class="bulk-toolbar">
          <label>공개 공유 링크<input id="shared-url" type="url" required maxlength="300" placeholder="https://everytime.kr/@…" autocomplete="off"></label>
          <button id="preview-import" class="button secondary">가져오기</button>
        </form>
        <p id="import-progress" role="status" hidden></p>
        <p id="import-summary" role="status" hidden></p>
        <div id="import-preview" hidden>
          <p class="field-hint">공식 분반과 일치한 과목만 표시합니다. 추가할 과목을 선택하세요.</p>
          <div id="import-table" class="table-wrap"></div>
          <div class="button-row selection-toolbar"><button id="apply-import" class="button primary">과목 추가</button><button id="discard-import" class="button secondary" type="button">가져온 목록 삭제</button><span id="import-selection" role="status"></span></div>
        </div>
      </section>
      <section class="card"><div class="list-heading"><div><h2>내 수강 내역 <span id="course-count" class="count">0</span></h2></div><button id="add-course" class="button secondary">＋ 이수 과목 직접 추가</button><button id="delete-all" class="button secondary danger" type="button">전체 삭제</button></div>
        <div id="course-list" class="table-wrap"></div>
      </section>
    </section>
    <section id="step-3" class="step-panel" hidden>
      <section class="card"><div class="card-title"><div><h2>입력 내용을 확인해주세요</h2></div></div><div id="summary-profile" class="summary-profile"></div><div id="summary-table" class="table-wrap"></div></section>
    </section>
    <footer class="actionbar"><div id="save-state" role="status">불러오는 중</div><div class="button-row"><button id="back" class="button secondary" type="button" hidden>이전</button><button id="next" class="button primary" type="button">다음</button></div></footer>
    </div></dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <div class="card">
        <h2 id="confirm-title">수강내역 변경 확인</h2>
        <p id="confirm-text"></p>
        <form method="dialog" class="button-row">
          <button class="button secondary" value="cancel" autofocus>취소</button>
          <button class="button primary" value="confirm">확인</button>
        </form>
      </div>
    </dialog>
  </main>
<datalist id="terms"><option value="2024-1"><option value="2024-2"><option value="2025-1"><option value="2025-2"><option value="2026-1"><option value="2026-2"><option value="2027-1"></datalist>
</body></html>
